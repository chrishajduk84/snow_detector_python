[tool.poetry]
name = "snow-detector-python"
version = "0.2.0"
description = "Radar dielectric profiler — estimate material properties (εr, tan δ) per range bin using FMCW radar"
authors = ["Chris Hajduk <chrishajduk84@gmail.com>"]
readme = "README.md"
repository = "https://github.com/chrishajduk84/snow_detector_python"
license = "MIT"
keywords = ["radar", "infineon", "bgt60tr13c", "iwr1443", "dielectric", "material-sensing"]
packages = [{include = "src"}]

[virtualenvs]
in-project = true

[tool.poetry.dependencies]
python = ">=3.11, <3.14"
numpy = "^2.0.0"
matplotlib = "^3.5.0"
fonttools = {path = "../fonttools", develop=true}
ifxdaq = {path = "../ifxdaq"}
ifxradarsdk = {path = "wheels/ifxradarsdk-3.6.4-py3-none-any.whl"}
scipy = "^1.16.3"
torch = {version = "2.11.0.dev20260105", source = "torch-nightly"}
scikit-learn = "^1.8.0"
seaborn = "^0.13.2"
h5py = "^3.10.0"
pyserial = "^3.5"

[tool.poetry.scripts]
radar-profiler = "main:main"

[tool.poetry.group.dev.dependencies]
black = "^22.0.0"
flake8 = "^5.0.0"

[[tool.poetry.source]]
name = "torch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 125
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # whitespace before ':'
    "W503",  # line break before binary operator
]
per-file-ignores = [
    "__init__.py:F401",
]